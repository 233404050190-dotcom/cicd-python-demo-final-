services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cicd-python-demo:dev
    container_name: cicd_python_dev
    ports:
      - "8000:8000"
    env_file:
      - envs/.env.dev
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
