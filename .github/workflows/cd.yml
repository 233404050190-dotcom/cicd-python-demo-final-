name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows:
      - CI Pipeline
    types:
      - completed
    branches:
      - main
      - develop
      - "feature/**"

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Windows 11 (TV1)

    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.repository.full_name == github.repository

    runs-on: [self-hosted, Windows, X64, tv1]

    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    steps:
      # 1. Checkout đúng commit đã vượt qua CI
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          clean: true

      # 2. Kiểm tra Docker Engine
      - name: Verify Docker Engine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $DockerVersion = & docker info --format '{{.ServerVersion}}'
          $DockerExitCode = $LASTEXITCODE

          if ($DockerExitCode -ne 0 -or
              [string]::IsNullOrWhiteSpace(($DockerVersion | Out-String).Trim())) {
              throw 'Docker Desktop is not running or Docker Engine is unavailable.'
          }

          Write-Host "Docker Engine version: $DockerVersion" -ForegroundColor Green

      # 3. Chuẩn bị thư mục deployment
      - name: Copy deployment files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Root = 'C:\cicd-python-demo'

          New-Item -ItemType Directory -Force -Path `
            $Root, "$Root\scripts", "$Root\envs" | Out-Null

          Copy-Item 'scripts/deploy.ps1' `
            "$Root\scripts\deploy.ps1" -Force

          Copy-Item 'docker-compose.development.yml' `
            "$Root\docker-compose.development.yml" -Force

          Copy-Item 'docker-compose.staging.yml' `
            "$Root\docker-compose.staging.yml" -Force

          Copy-Item 'docker-compose.prod.yml' `
            "$Root\docker-compose.prod.yml" -Force

          Copy-Item 'envs/.env.dev' `
            "$Root\envs\.env.dev" -Force

          Copy-Item 'envs/.env.staging' `
            "$Root\envs\.env.staging" -Force

          Copy-Item 'envs/.env.prod' `
            "$Root\envs\.env.prod" -Force

          Write-Host 'Deployment files copied successfully.' -ForegroundColor Green

      # 4. Đăng nhập GHCR bằng GITHUB_TOKEN
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Xác định môi trường và triển khai
      - name: Deploy Docker application
        shell: powershell
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Validate source commit
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') {
              throw "Invalid commit SHA: $env:SOURCE_SHA"
          }

          # Select target environment
          switch -Wildcard ($env:SOURCE_BRANCH) {
              'main' {
                  $Target = 'production'
              }

              'develop' {
                  $Target = 'staging'
              }

              'feature/*' {
                  $Target = 'development'
              }

              default {
                  throw "Unsupported branch: $env:SOURCE_BRANCH"
              }
          }

          $ImageTag = "sha-$env:SOURCE_SHA"
          $DeployScript = 'C:\cicd-python-demo\scripts\deploy.ps1'

          Write-Host "Source branch : $env:SOURCE_BRANCH"
          Write-Host "Target        : $Target"
          Write-Host "Image         : $ImageTag"

          # Run deployment script with an explicit execution policy.
          & powershell.exe `
            -NoLogo `
            -NoProfile `
            -NonInteractive `
            -ExecutionPolicy Bypass `
            -File $DeployScript `
            -Environment $Target `
            -ImageTag $ImageTag

          $DeployExitCode = $LASTEXITCODE

          if ($DeployExitCode -ne 0) {
              throw "Deployment failed with exit code $DeployExitCode"
          }

          Write-Host 'Deployment completed successfully.' -ForegroundColor Green

      # 6. Deployment summary
      - name: Deployment summary
        if: success()
        shell: powershell
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          Write-Host '====================================='
          Write-Host '       DEPLOYMENT SUCCESS'
          Write-Host '====================================='
          Write-Host "Branch : $env:SOURCE_BRANCH"
          Write-Host "Commit : $env:SOURCE_SHA"
          Write-Host 'Health Check: Passed'
          Write-Host '====================================='
