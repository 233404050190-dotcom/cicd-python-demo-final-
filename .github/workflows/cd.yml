name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, develop, "feature/**"]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Windows 11 (TV1)
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64, tv1]
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted deployment files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Docker and copy deployment files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker info | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Docker Desktop is not running' }
          $root = 'C:\cicd-python-demo'
          New-Item -ItemType Directory -Force -Path $root, "$root\scripts", "$root\envs" | Out-Null
          Copy-Item 'scripts/deploy.ps1' "$root\scripts\deploy.ps1" -Force
          Copy-Item 'docker-compose.development.yml' "$root\docker-compose.development.yml" -Force
          Copy-Item 'docker-compose.staging.yml' "$root\docker-compose.staging.yml" -Force
          Copy-Item 'docker-compose.prod.yml' "$root\docker-compose.prod.yml" -Force
          Copy-Item 'envs/.env.dev' "$root\envs\.env.dev" -Force
          Copy-Item 'envs/.env.staging' "$root\envs\.env.staging" -Force
          Copy-Item 'envs/.env.prod' "$root\envs\.env.prod" -Force

      - name: Log in to GitHub Container Registry
        shell: powershell
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          $env:GHCR_TOKEN | docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'GHCR login failed; check package permissions' }

      - name: Deploy exact image from successful CI
        shell: powershell
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_BRANCH -eq 'main') {
            $target = 'production'
          } elseif ($env:SOURCE_BRANCH -eq 'develop') {
            $target = 'staging'
          } elseif ($env:SOURCE_BRANCH -like 'feature/*') {
            $target = 'development'
          } else {
            throw "Unsupported branch: $env:SOURCE_BRANCH"
          }
          & 'C:\cicd-python-demo\scripts\deploy.ps1' -Environment $target -ImageTag "sha-$env:SOURCE_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

