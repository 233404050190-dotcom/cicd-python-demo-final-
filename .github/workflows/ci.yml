name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    uses: ./.github/workflows/ruff.yml

  test:
    name: Automated Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Unit and Integration Tests
        run: python -m pytest tests/ -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_id }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  build_push:
    name: Docker Build and Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality
      - test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image channel for deployment environment
        id: image-tag
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            main)
              echo "channel=latest" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "channel=staging-latest" >> "$GITHUB_OUTPUT"
              ;;
            feature/*)
              echo "channel=development-latest" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported deployment branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Build and push immutable and channel tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/233404050190-dotcom/cicd-python-demo:sha-${{ github.sha }}
            ghcr.io/233404050190-dotcom/cicd-python-demo:${{ steps.image-tag.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Notify CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality
      - test
      - build_push
    if: always()
    steps:
      - name: Compose CI result message
        id: result
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build_push.result }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          status="SUCCESS"

          if [[ "$QUALITY_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            status="FAILED"
          elif [[ "$EVENT_NAME" == "push" && "$BUILD_RESULT" != "success" ]]; then
            status="FAILED"
          fi

          short_sha="${SHA:0:7}"
          message="CI ${status} | Repository: ${GITHUB_REPOSITORY} | Branch: ${REF_NAME} | Event: ${EVENT_NAME} | Commit: ${short_sha} | Run: ${RUN_URL}"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'message=%s\n' "$message" >> "$GITHUB_OUTPUT"

      - name: Send Telegram and/or Discord notification
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE: ${{ steps.result.outputs.message }}
        shell: bash
        run: |
          set -euo pipefail
          sent=false

          if [[ -n "$TELEGRAM_BOT_TOKEN" && -n "$TELEGRAM_CHAT_ID" ]]; then
            if curl --fail-with-body --silent --show-error --max-time 15 \
              --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}"; then
              echo "Telegram notification sent."
            else
              echo "Telegram notification failed; CI result remains unchanged."
            fi
            sent=true
          fi

          if [[ -n "$DISCORD_WEBHOOK_URL" ]]; then
            payload="$(jq -n --arg content "$MESSAGE" '{content: $content}')"
            if curl --fail-with-body --silent --show-error --max-time 15 \
              --request POST \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "$DISCORD_WEBHOOK_URL"; then
              echo "Discord notification sent."
            else
              echo "Discord notification failed; CI result remains unchanged."
            fi
            sent=true
          fi

          if [[ "$sent" == "false" ]]; then
            echo "No Telegram/Discord secrets configured; notification skipped."
          fi
