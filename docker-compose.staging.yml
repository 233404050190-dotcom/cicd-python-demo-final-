services:
  web:
    image: ${DOCKER_IMAGE:?DOCKER_IMAGE must be set to an immutable GHCR image tag}
    container_name: cicd_python_staging
    ports:
      - "8001:8000"
    env_file:
      - envs/.env.staging
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
